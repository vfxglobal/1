<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VFX Global | Step 3 - Final Review</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="step.js" defer></script></head>
<body><div class="page-shell portal-shell"><header class="site-header"><div class="brand-wrap"><div class="brand-logo"><span>VFX</span></div><div class="brand-text"><strong>VFX</strong><span>GLOBAL</span></div></div><a class="mini-link" href="index.html">Customer Portal</a></header><main class="step-main"><div class="step-heading"><span class="number">03</span><div><p class="eyebrow">Step 3 of 3</p><h1>Step 3 - Final Review</h1><p>Confirm the remaining information before your application is finalized.</p></div></div><form id="stage3-form" class="step-form" data-stage="3"><div class="form-grid"><div class="field field-full"><label for="tracking-id">Tracking ID <span>*</span></label><input id="tracking-id" required placeholder="Enter your tracking ID"></div><div class="field"><label for="employmentStatus">Current Employment Status <span>*</span></label><select id="employmentStatus" required><option value="">Select status</option><option>Employed</option><option>Self-employed</option><option>Student</option><option>Retired</option><option>Unemployed</option><option>Other</option></select></div><div class="field"><label for="tripFinancer">Who Will Finance the Trip? <span>*</span></label><select id="tripFinancer" required><option value="">Select financer</option><option>Self</option><option>Employer</option><option>Parent</option><option>Spouse</option><option>Family member</option><option>Other</option></select></div><div class="field"><label for="visaRefusal">Previous Visa Refusal <span>*</span></label><select id="visaRefusal" required><option value="">Select answer</option><option>No</option><option>Yes</option></select></div><div class="field"><label for="destinationTravel">Previous Travel to Destination <span>*</span></label><select id="destinationTravel" required><option value="">Select answer</option><option>No</option><option>Yes</option></select></div><div class="field field-full"><label for="visaRefusalExplanation">Visa Refusal Explanation</label><textarea id="visaRefusalExplanation" placeholder="Complete only if you selected Yes"></textarea></div><div class="field field-full"><label for="travelHistory">Previous Travel Dates / Purpose</label><textarea id="travelHistory" placeholder="Complete only if you selected Yes"></textarea></div><div class="field field-full"><label for="additionalInformation">Additional Information</label><textarea id="additionalInformation" placeholder="Optional information"></textarea></div><div class="field field-full declaration-field"><label><input id="declaration" type="checkbox" required> I confirm that the information and documents I have provided are accurate and complete.</label></div><div class="field field-full"><label for="signature">Electronic Signature <span>*</span></label><input id="signature" required placeholder="Type your full name"></div></div><p class="signature-date">Date recorded automatically: <span id="signature-date"></span></p><div id="final-review-summary" class="final-review-summary" hidden></div><div class="field field-full payment-field"><label>Payment Method <span>*</span></label><div id="payment-method-options" class="payment-options" role="radiogroup"></div><p id="payment-method-message" class="payment-message">Choose a payment method to see the agent's details.</p></div><div class="field field-full screenshot-field"><label for="payment-screenshot">Payment Screenshot</label><div class="upload-wrap"><input id="payment-screenshot" type="file" accept=".jpg,.jpeg,.png,.pdf"><label class="upload-button" for="payment-screenshot">Choose Screenshot</label><span id="payment-screenshot-name">No file selected</span></div></div><div class="form-actions"><a class="secondary-btn" href="file-submission.html">Back</a><button class="submit-btn" type="submit">Save &amp; Continue</button></div><p id="step-message" class="login-message" role="status"></p></form></main></div><script>document.querySelector('#signature-date').textContent = new Date().toLocaleDateString('en-GB');</script></body></html>

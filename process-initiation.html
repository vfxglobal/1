<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VFX Global | Step 1 - Visa Process Initiation</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="step.js" defer></script></head>
<body><div class="page-shell portal-shell"><header class="site-header"><div class="brand-wrap"><div class="brand-logo"><span>VFX</span></div><div class="brand-text"><strong>VFX</strong><span>GLOBAL</span></div></div><a class="mini-link" href="index.html">Customer Portal</a></header><main class="step-main"><div class="step-heading"><span class="number">01</span><div><p class="eyebrow">Step 1 of 3</p><h1>Step 1 - Visa Process Initiation</h1><p>Provide the additional information required to begin your visa application.</p></div></div><form id="stage1-form" class="step-form" data-stage="1"><div class="form-grid"><div class="field field-full"><label for="tracking-id">Tracking ID <span>*</span></label><input id="tracking-id" required placeholder="Enter your tracking ID"></div><div class="field"><label for="visaCategory">Visa Category <span>*</span></label><select id="visaCategory" required><option value="">Select category</option><option>Tourist</option><option>Business</option><option>Student</option><option>Medical</option><option>Employment</option><option>Family/Visit</option><option>Conference</option><option>Other</option></select></div><div class="field"><label for="arrivalDate">Intended Travel / Arrival Date <span>*</span></label><input id="arrivalDate" type="date" required></div><div class="field field-full"><label for="purpose">Purpose of Travel <span>*</span></label><input id="purpose" required placeholder="Short explanation"></div><div class="field"><label for="duration">Intended Duration of Stay <span>*</span></label><input id="duration" required placeholder="e.g. 14 days"></div><div class="field"><label for="destination">Intended Destination City / Cities <span>*</span></label><input id="destination" required placeholder="City or cities"></div><div class="field"><label for="accommodationType">Accommodation Plan <span>*</span></label><select id="accommodationType" required><option value="">Select plan</option><option>Hotel</option><option>Family/Friend</option><option>Company accommodation</option><option>Other</option></select></div><div class="field"><label for="accommodationDetails">Accommodation Details <span>*</span></label><input id="accommodationDetails" required placeholder="Name, address, or booking details"></div><div class="field"><label for="hostName">Host / Inviter Name</label><input id="hostName" placeholder="If applicable"></div><div class="field"><label for="hostRelationship">Relationship</label><input id="hostRelationship" placeholder="If applicable"></div><div class="field"><label for="hostLocation">Host Country / City</label><input id="hostLocation" placeholder="If applicable"></div><div class="field"><label for="hostContact">Host Contact Information</label><input id="hostContact" placeholder="Phone or email"></div></div><div class="field field-full payment-field"><label>Payment Method <span>*</span></label><div id="payment-method-options" class="payment-options" role="radiogroup"></div><p id="payment-method-message" class="payment-message">Choose a payment method to see the agent's details.</p></div><div class="field field-full screenshot-field"><label for="payment-screenshot">Payment Screenshot</label><div class="upload-wrap"><input id="payment-screenshot" type="file" accept=".jpg,.jpeg,.png,.pdf"><label class="upload-button" for="payment-screenshot">Choose Screenshot</label><span id="payment-screenshot-name">No file selected</span></div></div><div class="form-actions"><a class="secondary-btn" href="form-filling.html">Back</a><button class="submit-btn" type="submit">Save &amp; Continue</button></div><p id="step-message" class="login-message" role="status"></p></form></main></div></body></html>
